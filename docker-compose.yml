services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: repo-assistant-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  app:
    build: .
    container_name: repo-assistant-app
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "18080:8000"
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
